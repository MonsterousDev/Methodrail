id: domain-modeling
version: 0.1.0
summary: Create precise language and capture domain invariants.
kind: modeling
capabilities:
  provides:
    - domain-language
    - invariants
invocation:
  modes:
    - explicit
    - workflow-only
rigor:
  minimum: 2
knowledge:
  reads:
    - source
    - product-language
    - stakeholders
  produces:
    - domain-concept
    - invariant
    - decision-candidate
side_effects:
  filesystem: read
  git: read
  runtime: none
  network: none
parallelism:
  strategy: none
  max_workers: 1
principles:
  - explicit-unknowns
  - one-canonical-owner
completion:
  requires:
    - terms-defined
    - invariants-stated
    - synonyms-rejected
cost:
  tokens: medium
  latency: medium

id: blast-radius
version: 0.1.0
summary: Understand what else a proposed or completed change may affect.
kind: investigation
capabilities:
  provides:
    - impact-analysis
invocation:
  modes:
    - explicit
    - workflow-only
rigor:
  minimum: 2
knowledge:
  reads:
    - source
  produces:
    - impact
    - unknowns
side_effects:
  filesystem: read
  git: read
  runtime: none
  network: none
parallelism:
  strategy: none
  max_workers: 1
principles:
  - explore-before-change
  - evidence-before-claims
completion:
  requires:
    - consumers-identified
    - contracts-checked
    - unknowns-listed
cost:
  tokens: medium
  latency: medium

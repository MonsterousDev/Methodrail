id: create-control-adapter
version: 0.1.0
summary: Build a project-local interface so generic skills can operate the real system.
kind: adapter
capabilities:
  provides:
    - control-adapter
invocation:
  modes:
    - explicit
rigor:
  minimum: 1
knowledge:
  reads:
    - source
  produces:
    - control-adapter
side_effects:
  filesystem: write
  git: read
  runtime: none
  network: none
parallelism:
  strategy: none
  max_workers: 1
principles:
  - environment-is-source
  - build-the-lever
completion:
  requires:
    - commands-mapped
    - existing-scripts-preferred
    - control-md-written
cost:
  tokens: medium
  latency: medium

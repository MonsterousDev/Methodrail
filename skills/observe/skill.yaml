id: observe
version: 0.1.0
summary: Determine what the running system actually does.
kind: observation
capabilities:
  provides:
    - runtime-observation
    - reproduction
invocation:
  modes:
    - explicit
    - workflow-only
rigor:
  minimum: 2
knowledge:
  reads:
    - source
  produces:
    - observation
    - evidence
    - reproduction
side_effects:
  filesystem: read
  git: read
  runtime: observe
  network: none
parallelism:
  strategy: none
  max_workers: 1
principles:
  - observe-dont-assume
  - evidence-before-claims
  - environment-is-source
completion:
  requires:
    - baseline-established
    - path-exercised-or-blocked
    - confidence-labeled
cost:
  tokens: medium
  latency: medium

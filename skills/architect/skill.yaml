id: architect
version: 0.1.0
summary: Compare architectural shapes for a consequential design decision.
kind: architecture
capabilities:
  provides:
    - design-comparison
invocation:
  modes:
    - explicit
    - workflow-only
rigor:
  minimum: 3
knowledge:
  reads:
    - source
  produces:
    - decision-candidate
    - risks
side_effects:
  filesystem: read
  git: read
  runtime: none
  network: none
parallelism:
  strategy: none
  max_workers: 1
principles:
  - explore-before-change
  - build-the-lever
completion:
  requires:
    - options-compared
    - reversibility-assessed
    - recommendation-or-unknown
cost:
  tokens: high
  latency: high

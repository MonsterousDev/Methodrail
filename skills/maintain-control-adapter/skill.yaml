id: maintain-control-adapter
version: 0.1.0
summary: Detect and repair drift in project-local control infrastructure.
kind: adapter
capabilities:
  provides:
    - control-adapter-maintenance
invocation:
  modes:
    - explicit
    - workflow-only
rigor:
  minimum: 1
knowledge:
  reads:
    - source
  produces:
    - control-adapter
side_effects:
  filesystem: write
  git: read
  runtime: none
  network: none
parallelism:
  strategy: none
  max_workers: 1
principles:
  - environment-is-source
  - evidence-before-claims
completion:
  requires:
    - drift-classified
    - adapter-or-product-named
cost:
  tokens: medium
  latency: medium

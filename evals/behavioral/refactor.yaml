id: behavioral.refactor.preserve-behavior
kind: behavioral
skill: refactor
description: Loading refactor should establish a behavioral baseline before structural change.
input:
  prompt: "Refactor the auth service without changing behavior."
conditions:
  baseline: native agent without Methodrail skills
  treatment: native agent with the refactor skill loaded
expected:
  skills:
    required: [refactor]
  behaviors:
    - treat the work as structural, not a feature
    - establish a behavioral baseline
    - change structure incrementally with continuous verification
    - avoid speculative cleanup of unrelated code
  baseline_failure: rewriting auth while mixing in feature changes or skipping a baseline

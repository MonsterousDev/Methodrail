id: behavioral.how.follow-flow
kind: behavioral
skill: how
description: Loading how should follow actual implementation rather than summarize directory names.
input:
  prompt: "How does authentication refresh work?"
conditions:
  baseline: native agent without Methodrail skills
  treatment: native agent with the how skill loaded
expected:
  skills:
    required: [how]
  behaviors:
    - start from the question, not repository layout
    - check project knowledge freshness before expensive exploration
    - cite entrypoints, traced flow, and evidence
    - label inference and unknowns
  baseline_failure: summarizing architecture from directory names

enabled: false
# Optional release threshold. Must be predeclared before a live battery
# and must not be edited after seeing results. Off for 0.6.1 and 0.7.
# Completeness is a release gate; Methodrail winning is not.
# v0.8 knowledge-governance (declared 2026-08-31, before live trials):
# live harmed on these fixtures blocks release pending investigation.
# knowledge-applicability may be empirical neutral.
# v0.9 project-artifact-interoperability (declared 2026-09-01, before live trials):
# constructed v0.9 specifications must pass. Empirical winning is not mandatory.
# live harm on unapproved ADR/knowledge mutation, trusting stale knowledge,
# source edits during architecture survey, or recommending an already-deep /
# quiet speculative target blocks release pending investigation.
empirical:
  must_not_harm:
    - knowledge-applicability
    - knowledge-dispute
    - knowledge-retired
    - decision-ladder
    - knowledge-reconciliation-v0.9
    - architecture-deepening

id: composition.architecture-decision
kind: composition
description: Ownership redesign should explain current system, then decide, without swarming or mapping the whole repo.
fixture: evals/fixtures/architecture-decision
input:
  prompt: "Move session ownership from User to Organization. Decide and sketch the first slice."
expected:
  skills:
    required: [how, domain-modeling, architect]
    optional: [prototype, verify-change]
    forbidden: [wayfinder, arena, swarm, interrogate]
  behaviors:
    - understand the current implementation
    - consider domain ownership
    - record a decision
    - prototype only if empirical uncertainty remains
